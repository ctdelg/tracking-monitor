name: Daily tracking check

on:
  schedule:
    # 04:17 UTC Mon-Fri. Off the full hour on purpose: GitHub delays top-of-hour schedules by hours
    # (the 05:00 slot started between 13:43 and 15:46 UTC in Nov 2026).
    - cron: "17 4 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "Market codes, space separated (empty = all)"
        required: false
        default: ""
      url:
        description: "Only these URL ids, space separated (empty = all)"
        required: false
        default: ""
      no_browser:
        description: "Only Tealium CDN + load-rule checks"
        type: boolean
        default: false

permissions:
  contents: write   # commit results back to the repo

concurrency:
  group: tracking-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Regression tests
        run: python -m unittest discover tests

      - name: Run checks
        env:
          # Allowlist header agreed with the sage.com web team, format "Header-Name: secret".
          # Leave the secret unset until the allowlist exists: pages are then reported as
          # "blocked" and only Tealium CDN + load-rule checks count.
          MONITOR_AUTH_HEADER: ${{ secrets.MONITOR_AUTH_HEADER }}
          IN_MARKET: ${{ github.event.inputs.market }}
          IN_URL: ${{ github.event.inputs.url }}
          IN_NO_BROWSER: ${{ github.event.inputs.no_browser }}
        run: |
          ARGS=()
          if [ -n "$IN_MARKET" ]; then read -ra M <<< "$IN_MARKET"; ARGS+=(--market "${M[@]}"); fi
          if [ -n "$IN_URL" ]; then read -ra U <<< "$IN_URL"; ARGS+=(--url "${U[@]}"); fi
          if [ "$IN_NO_BROWSER" = "true" ]; then ARGS+=(--no-browser); fi
          python -m monitor run "${ARGS[@]}"

      - name: Commit results
        run: |
          git config user.name "tracking-monitor[bot]"
          git config user.email "tracking-monitor@users.noreply.github.com"
          # baseline/ learns new pages and config/forms/ holds the form inventory: both change on every run
          git add results report baseline config/forms
          git commit -m "Results $(date -u +%F)" || echo "No changes"
          git pull --rebase
          git push

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: report/index.html
          retention-days: 90
