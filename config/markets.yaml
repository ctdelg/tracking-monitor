# Markets, pages and journeys checked by the monitor.
#
# Maintained via the Claude skill "tracking-monitor" (e.g. "Add URL ... to FR as landing page").
# You can also edit this file directly - keep the indentation.
#
# URL fields:
#   id           unique, short, lowercase (used in reports and baselines)
#   url          full URL without tracking parameters (the monitor adds gclid/msclkid/fbclid + utm)
#   type         landing_page | product | pricing | form | trial | checkout | content
#   live_sample  true on ONE page per market: tracking hits are let through (marked with
#                utm_source=tracking-monitor) to verify real vendor responses. All other pages
#                block hits so no data is created.
#
# STATUS 2026-11-14: URL lists are a first PROPOSAL derived from the sitemaps. Paid-only landing
# pages (noindex, not in sitemaps) still need to be added by the market owners.

settings:
  # Tealium tag templates that carry conversions (used for CONV-01/03 and the publish diff).
  conversion_templates:
    "4049": Floodlight
    "7132": Google Ads

# Conversion events replayed through the load rules (CONV-01). Never sent anywhere.
# - ecom_*: the Next.js trial/buy checkout (sends action + customer_lead_type, no gate_content_name)
# - gated_*: Sitecore lead forms. Tealium derives ga4_customer_lead_type from the code inside
#   gate_content_name (_TRL_/_DEM_ -> trial_demo, _CON_ -> contact, _PDF_ -> download ...).
default_conversion_events:
  - name: ecom_try
    payload: {action: form_submit_success, tealium_event: form_submit_success, customer_lead_type: ecom_try}
  - name: ecom_buy
    payload: {action: form_submit_success, tealium_event: form_submit_success, customer_lead_type: ecom_buy}
  - name: gated_trial
    payload: {action: form_submit_success, event_name: form_submit_success, triggered_by: sitecore, release_date: "2026-01-01",
              gate_content_name: XX_INT_XX_SMB_TRL_TrackingMonitor, customer_lead_type: Trial_Demo, number_of_employees: 10-49 Employees}
  - name: gated_contact
    payload: {action: form_submit_success, event_name: form_submit_success, triggered_by: sitecore, release_date: "2026-01-01",
              gate_content_name: XX_INT_XX_SMB_CON_TrackingMonitor, customer_lead_type: Contact, number_of_employees: 10-49 Employees}
  - name: purchase
    payload: {tealium_event: purchase, event: purchase, page_id: purchase_complete, transaction_id: TEST_MON, order_id: TEST_MON, customer_lead_type: ecom_buy}

