    tag_manager: {type: gtm, container: GTM-PS6MXC}
    locale: de-AT
    urls:
      # Source: paid search landing page report, 2026-11-16 - tracking parameters removed, 6 URLs.
      - {id: at-dpw-sage-dpw, url: "https://www.sagedpw.at/loesungen/sage-dpw/", type: product, live_sample: true}
      - {id: at-dpw-zeiterfassung, url: "https://www.sagedpw.at/hr-software/zeiterfassung/", type: landing_page}
      - {id: at-dpw-lohn-outsourcing, url: "https://www.sagedpw.at/loesungen/sage-dpw-lohn-outsourcing/", type: product}
      - {id: at-dpw-lohnverrechnung, url: "https://www.sagedpw.at/hr-software/lohnverrechnung/", type: landing_page}
      - {id: at-dpw-reisekostenabrechnung, url: "https://www.sagedpw.at/hr-software/reisekostenabrechnung/", type: landing_page}
      - {id: at-dpw-fairpay, url: "https://www.sagedpw.at/hr-software/fairpay/", type: landing_page}
    journeys:
      # The CTAs lead to separate form pages; the journeys check that the click ID and the tags survive
      # into the form. Nothing is submitted.
      - id: at-j-infopaket
        name: Zeiterfassung -> Infopaket download form
        steps:
          - goto: "https://www.sagedpw.at/hr-software/zeiterfassung/"
          - click: "a[href*='/kostenloses-infopaket/']"
            expect_url: "/kostenloses-infopaket/"
      - id: at-j-kontakt
        name: Zeiterfassung -> contact form
        steps:
          - goto: "https://www.sagedpw.at/hr-software/zeiterfassung/"
          - click: "a[href*='/kontaktformular/']"
            expect_url: "/kontaktformular/"

