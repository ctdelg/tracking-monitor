<title>EU Tracking Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell (sidebar + main). Main reads top-down: verdict card (sentence, key figures, market
   board or brief), market x conversion-event matrix, workday status strip, findings grouped by who has
   to act, publishes (only when one changed something). Red marks lost conversions and broken consent
   only, and only once per item: the dot. No line charts: runs are daily pass/fail states. */
:root {
  --page: #ffffff; --shell: #f4f4f6; --surface: #ffffff; --sunk: #f4f4f6;
  --fg: #020a0f; --muted: #5d636b; --faint: #8b9098; --line: rgba(80, 84, 92, .14); --ring: rgba(103, 103, 103, .10);
  --accent: #1b65be; --brand: #00d639;
  --ok: #1f7a32; --ok-fill: #2f9e44; --ok-bg: #e8f5ea;
  --warn: #8a5300; --warn-fill: #e39b1f; --warn-bg: #fdf2dc;
  --crit: #b42318; --crit-fill: #d93a2b; --crit-bg: #fdeceb;
  --down: #3f5a74; --down-fill: #5b7a99; --down-bg: #e7eef5;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --shadow: 0 0 0 1px var(--ring), 0 2px 4px var(--ring);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0b0e12; --shell: #12161c; --surface: #191e25; --sunk: #12161c;
  --fg: #eef1f4; --muted: #a3abb5; --faint: #7c8590; --line: rgba(200, 210, 220, .12); --ring: rgba(0, 0, 0, .35);
  --accent: #6aa8ea;
  --ok: #5fd07a; --ok-fill: #3fb35a; --ok-bg: #12291a;
  --warn: #f0b24d; --warn-fill: #e39b1f; --warn-bg: #2d2412;
  --crit: #ff7b6e; --crit-fill: #e5483a; --crit-bg: #35171a;
  --down: #9db8d3; --down-fill: #6f8fae; --down-bg: #1b2530;
  --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 2px 6px var(--ring); color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0b0e12; --shell: #12161c; --surface: #191e25; --sunk: #12161c;
  --fg: #eef1f4; --muted: #a3abb5; --faint: #7c8590; --line: rgba(200, 210, 220, .12); --ring: rgba(0, 0, 0, .35);
  --accent: #6aa8ea;
  --ok: #5fd07a; --ok-fill: #3fb35a; --ok-bg: #12291a;
  --warn: #f0b24d; --warn-fill: #e39b1f; --warn-bg: #2d2412;
  --crit: #ff7b6e; --crit-fill: #e5483a; --crit-bg: #35171a;
  --down: #9db8d3; --down-fill: #6f8fae; --down-bg: #1b2530;
  --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 2px 6px var(--ring); color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--fg); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* shell */
.shell { width: calc(100% - 32px); max-width: 1360px; margin: 16px auto; background: var(--shell); border-radius: 24px; padding: 12px;
  display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 12px; align-items: start; }
.side { position: sticky; top: 12px; background: var(--surface); box-shadow: var(--shadow); border-radius: 20px; padding: 18px 12px; display: grid; gap: 2px; }
.brand { display: grid; gap: 2px; padding: 0 8px 16px; }
.brand svg { width: 76px; height: auto; display: block; }
.brand span { font-size: 12.5px; color: var(--muted); }
.navlabel { font-size: 12px; color: var(--faint); padding: 14px 10px 4px; }
.nav, .mk { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 10px;
  text-align: left; color: var(--muted); font-weight: 500; transition: background-color .15s, color .15s; }
.nav:hover, .mk:hover { background: var(--sunk); color: var(--fg); }
.nav[aria-current="true"] { color: var(--fg); }
.nav[aria-current="true"] svg { color: var(--accent); }
.mk[aria-pressed="true"] { background: var(--sunk); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.mk .nm { flex: 1; }
.nav svg { width: 17px; height: 17px; flex: none; transition: color .15s; }
.nav[hidden] { display: none; }
.legend2 { display: grid; gap: 4px; font-size: 12px; color: var(--faint); padding: 14px 10px 0; }
.legend2 span { display: flex; gap: 8px; align-items: center; }

/* status dot: solid = checked on the page, ring = Tealium config only */
.sd { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--faint); }
.sd.red { background: var(--crit-fill); } .sd.yellow { background: var(--warn-fill); } .sd.green { background: var(--ok-fill); }
.sd.down { background: var(--down-fill); }
.sd.cfg { background: transparent; box-shadow: inset 0 0 0 2px var(--ok-fill); }
.sd.cfg.yellow { box-shadow: inset 0 0 0 2px var(--warn-fill); } .sd.cfg.red { background: var(--crit-fill); box-shadow: none; }

.main { display: grid; gap: 12px; min-width: 0; }
.main > * { min-width: 0; }
.card { background: var(--surface); box-shadow: var(--shadow); border-radius: 20px; padding: 20px 22px; display: grid; gap: 16px; min-width: 0; }
.card[hidden] { display: none; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.head .muted { font-size: 12.5px; }

/* verdict */
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 500; }
.verdict h1 { font-size: clamp(24px, 2.6vw, 34px); line-height: 1.18; text-wrap: pretty; }
.verdict h1 .rest { color: var(--faint); }
.kpis { display: flex; flex-wrap: wrap; gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.kpi { flex: 1 1 160px; display: grid; gap: 2px; padding: 12px 16px; border-left: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi b { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.kpi b small { font-size: 13px; font-weight: 500; color: var(--faint); letter-spacing: 0; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.kpi.bad b::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--crit-fill); }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; background: var(--sunk); border-radius: 12px; font-size: 13.5px; }
.alert svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--crit); }
.alert b { font-weight: 600; }

/* brief: a 12-column grid, rows balanced by the script (5 blocks -> 3 + 2, never 4 + 1) */
.brief { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; }
.bt { grid-column: span var(--span, 3); background: var(--sunk); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.bt h3 { font-size: 13px; display: flex; align-items: center; gap: 8px; }
.bt ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13.5px; }
.bt li { position: relative; padding-left: 14px; overflow-wrap: anywhere; }
.bt li::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.bt.red li::before { background: var(--crit-fill); } .bt.yellow li::before { background: var(--warn-fill); }
.bt.green li::before { background: var(--ok-fill); }
.bt .act { color: var(--muted); }
.bt .from { font-size: 12.5px; color: var(--muted); margin-top: -4px; }
.blink { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; transition: text-decoration-color .15s; }
.blink:hover { text-decoration-color: currentColor; }
.finding { scroll-margin: 120px; }
.finding.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: inset 0 0 0 2px var(--accent); } 100% { box-shadow: inset 0 0 0 1px var(--line); } }
@media (prefers-reduced-motion: reduce) { .finding.flash { animation: none; box-shadow: inset 0 0 0 2px var(--accent); } }
.bt p { font-size: 13.5px; }

/* market board (all markets): one equal tile per market */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.mt { display: grid; gap: 8px; align-content: start; text-align: left; border: 0; background: var(--sunk); border-radius: 14px; padding: 14px 16px; min-width: 0;
  transition: transform .15s, box-shadow .15s, background-color .15s; }
.mt:hover { transform: translateY(-2px); background: var(--surface); box-shadow: var(--shadow); }
.mt:active { transform: translateY(0); }
.mt-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mt-line { font-weight: 500; font-size: 14px; line-height: 1.35; }
.mt-meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.crumb, .linkish { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 2px; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.s-green { color: var(--ok); background: var(--ok-bg); } .s-yellow { color: var(--warn); background: var(--warn-bg); }
.s-red { color: var(--crit); background: var(--crit-bg); } .s-down { color: var(--down); background: var(--down-bg); }
.s-sys { color: var(--muted); background: var(--sunk); }
.s-cfg { color: var(--ok); background: transparent; box-shadow: inset 0 0 0 1px var(--ok-fill); }
.owner { display: inline-flex; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--fg); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }

/* tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 10px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
thead th { border-top: 0; font-size: 12px; font-weight: 500; color: var(--faint); white-space: nowrap; padding-top: 0; }
tbody tr.sel { cursor: pointer; transition: background-color .15s; }
tbody tr.sel:hover { background: var(--sunk); }
.code { font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.ok-t { color: var(--ok); } .bad-t { color: var(--crit); font-weight: 500; white-space: nowrap; } .na-t { color: var(--faint); } .ack-t { color: var(--faint); text-decoration: line-through; }
.ic { width: 15px; height: 15px; vertical-align: -3px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.mcards { display: none; gap: 10px; }
.mcard { display: grid; gap: 8px; text-align: left; border: 0; background: var(--sunk); border-radius: 14px; padding: 12px 14px; }
.mcard .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }

/* workday strip */
.strip { display: grid; gap: 13px; }
.srow { display: grid; gap: 4px; align-items: center; }
.srow b { font-weight: 600; font-size: 13px; }
.q { position: relative; height: 18px; border-radius: 4px; background: var(--sunk); }
.q.red { background: var(--crit-fill); } .q.yellow { background: var(--warn-fill); } .q.green { background: var(--ok-fill); }
.q.green.cfg { background: transparent; box-shadow: inset 0 0 0 2px var(--ok-fill); }
.q.yellow.cfg { background: transparent; box-shadow: inset 0 0 0 2px var(--warn-fill); }
.q.pub::after { content: ""; position: absolute; left: 50%; top: -8px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
button.q { border: 0; padding: 0; cursor: pointer; transition: transform .12s; }
button.q:hover { transform: translateY(-2px); }
.q.on { transform: scaleY(1.22); }
button.q.on:hover { transform: scaleY(1.22) translateY(-1px); }
.dates span { font-size: 11.5px; color: var(--faint); text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dates span.today { color: var(--fg); font-weight: 500; }
.legend .q { width: 16px; height: 12px; display: inline-block; }
.legend .q.pub::after { top: 3.5px; left: 50%; }

/* notices */
.notice { background: var(--surface); box-shadow: var(--shadow); border-radius: 16px; padding: 12px 16px; display: grid; gap: 4px; }
.notice.warn { box-shadow: 0 0 0 1px var(--warn-fill), 0 2px 4px var(--ring); }
.notice.past { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; box-shadow: 0 0 0 1px var(--accent), 0 2px 4px var(--ring); }

/* grouped findings: one row per problem and market */
.lane { display: grid; gap: 4px; }
.lane + .lane { margin-top: 8px; }
.lane h3 { font-size: 13px; color: var(--muted); font-weight: 500; display: flex; gap: 8px; align-items: center; padding-bottom: 6px; }
.lane h3 b { color: var(--fg); font-weight: 600; }
.need { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto 16px; gap: 14px; align-items: center; padding: 12px 10px; margin: 0 -10px;
  border: 0; border-top: 1px solid var(--line); background: none; text-align: left; border-radius: 10px; transition: background-color .15s; }
.need:hover { background: var(--sunk); }
.need:hover + .need, .lane h3 + .need { border-top-color: transparent; }
.need-body { display: grid; gap: 2px; min-width: 0; }
.need-body b { font-weight: 600; }
.need-body .muted { font-size: 13px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.need-tags { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.need-tags:empty { display: none; }
.need .pages { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.need .chev { width: 16px; height: 16px; color: var(--faint); transition: transform .15s; }
.need:hover .chev { transform: translateX(2px); color: var(--fg); }

/* findings in a market */
.findings { display: grid; gap: 10px; }
.finding { border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; box-shadow: inset 0 0 0 1px var(--line); }
.finding.acked { opacity: .6; }
.finding .line1 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.finding .title { font-weight: 600; }
.finding .detail { overflow-wrap: anywhere; color: var(--muted); }
.diag { padding: 10px 12px; background: var(--sunk); border-radius: 10px; font-size: 13.5px; }
.diag::before { content: "Diagnosis  "; font-size: 12px; font-weight: 600; color: var(--accent); }
details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
pre.ev { margin: 6px 0 0; padding: 10px; background: var(--sunk); border-radius: 10px; overflow-x: auto; font: 12px/1.45 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500;
  transition: background-color .15s, transform .1s; }
.btn:hover { background: var(--sunk); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--fg); color: var(--page); box-shadow: none; }
.btn.primary:hover { opacity: .88; }
.ackform { display: grid; gap: 10px; padding: 12px; background: var(--sunk); border-radius: 12px; }
.ackform label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.ackform input, .ackform select { font: inherit; color: var(--fg); background: var(--surface); border: 0; box-shadow: inset 0 0 0 1px var(--line); border-radius: 8px; padding: 7px 10px; }

/* page matrix */
td.cell { text-align: center; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); }
.dot.pass { background: var(--ok-fill); box-shadow: none; } .dot.fail-red { background: var(--crit-fill); box-shadow: none; }
.dot.fail-yellow, .dot.warn { background: var(--warn-fill); box-shadow: none; }
.dot.fail-site_down { background: var(--down-fill); box-shadow: none; } .dot.blocked { background: var(--faint); box-shadow: none; }
.dot.acked { background: transparent; box-shadow: inset 0 0 0 2px var(--faint); }

.diffitem { border-top: 1px solid var(--line); padding: 8px 0; display: grid; gap: 4px; min-width: 0; }
.diffitem code { font: 12px var(--f-mono); overflow-wrap: anywhere; }
footer { color: var(--faint); font-size: 12.5px; padding: 4px 10px; }

@media (max-width: 1080px) {
  .bt { grid-column: span 6; }
  .bt:last-child:nth-child(odd) { grid-column: span 12; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); width: 100%; margin: 0; border-radius: 0; padding: 10px; }
  .side { position: static; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px; }
  .brand { padding: 0 8px 0 4px; margin-right: auto; }
  .navlabel, .nav, .legend2 { display: none; }
  .mk { width: auto; padding: 8px 12px; min-height: 44px; }
  .card { padding: 16px; border-radius: 16px; }
  .bt, .bt:last-child:nth-child(odd) { grid-column: span 12; }
  .kpi { flex-basis: 50%; padding: 10px 0; border-left: 0; }
  .kpi:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--line); }
  .matrix-table { display: none; }
  .mcards { display: grid; }
  .need { grid-template-columns: 44px minmax(0, 1fr) 16px; }
  .need-tags { grid-column: 2; justify-content: flex-start; }
  .need .chev { grid-column: 3; grid-row: 1; }
  .dates .wd { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</div>

<script>
(function () {
  "use strict";
  const MODE = "__MODE__";
  const P = __DATA__;
  const H = P.history || {days: {}};
  // Every run inside the 14-day window is embedded; R/D/MARKETS point at the run being viewed.
  const LATEST = P.results.day;
  const RUNS = Object.assign({}, P.runs || {}, {[LATEST]: {results: P.results, diagnosis: P.diagnosis}});
  let R = P.results, D = P.diagnosis || {};
  let MARKETS = Object.keys(R.markets);
  const ORDER = {green: 0, yellow: 1, red: 2};
  const EVENTS = {ecom_try: "Web-shop trial", ecom_buy: "Web-shop purchase", gated_trial: "Trial form", gated_contact: "Contact form", purchase: "Order confirmed (sales tag)"};
  // What went wrong, in words, per check (the check titles state the expectation instead).
  const PROBLEMS = {"CONS-01": "No consent banner", "CONS-02": "Marketing tags or cookies before consent", "CONS-03": "Consent Mode not denied by default",
    "CONS-04": "Consent not stored after 'Accept all'", "CONS-05": "Third-party requests before consent", "CLID-01": "gclid not stored",
    "CLID-02": "msclkid not stored", "CLID-03": "fbclid not stored", "CLID-04": "gclid missing on Google hits", "PAGE-01": "Page not reachable",
    "PAGE-02": "Page doesn't render", "PAGE-03": "Landing page redirects", "TEAL-01": "Tealium doesn't load", "TEAL-02": "Wrong Tealium profile",
    "TEAL-03": "Data layer values missing", "TEAL-05": "utag.js not reachable", "TAG-BASELINE": "Tag baseline still learning"};
  const LANES = [["conv", "Conversions and tracking"], ["consent", "Consent and privacy"], ["site", "Site down"]];
  let liveAcks = [];          // from the artifact database
  let db = null, user = null, myId = null, names = {}, canWrite = false;
  // Scope: "ALL" (cross-market overview) or one market code. A #CODE link wins; otherwise each viewer
  // lands on the scope they used last (kept in their own browser only).
  const ALL = "ALL", SCOPE_KEY = "tracking-monitor.scope";
  const validScope = v => v === ALL || MARKETS.includes(v);
  const readScope = () => { try { return localStorage.getItem(SCOPE_KEY); } catch (e) { return null; } };
  const writeScope = v => { try { localStorage.setItem(SCOPE_KEY, v); } catch (e) { /* private mode */ } };
  // Hash: #DE, #ALL, or with a run day #DE@2026-11-14.
  const parseHash = () => { const [s, d] = (location.hash || "").replace("#", "").split("@"); return {scope: (s || "").toUpperCase(), day: d || null}; };
  const hashFor = () => "#" + selected + (R.day !== LATEST ? "@" + R.day : "");
  let selected = parseHash().scope;
  if (!validScope(selected)) selected = readScope();
  if (!validScope(selected)) selected = ALL;
  function loadRun(day) {
    const run = RUNS[day] || RUNS[LATEST];
    R = run.results; D = run.diagnosis || {}; MARKETS = Object.keys(R.markets);
    if (!validScope(selected)) selected = ALL;
  }
  if (parseHash().day && RUNS[parseHash().day]) loadRun(parseHash().day);
  let openAckFor = null;

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "text") n.textContent = v; else n.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const fill = (id, ...kids) => document.getElementById(id).replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false));
  const SVGNS = "http://www.w3.org/2000/svg";
  const icon = (d, cls) => { const s = document.createElementNS(SVGNS, "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none");
    s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2.2"); s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
    s.setAttribute("aria-hidden", "true"); s.setAttribute("class", cls || "ic"); const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", d); s.append(p); return s; };
  const I_CHECK = "M5 12.5l4.5 4.5L19 7.5", I_X = "M6 6l12 12M18 6L6 18", I_CHEV = "M9 6l6 6-6 6", I_LINK = "M12 9v4m0 4h.01M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z";
  const fmtDay = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC"});
  const shortDay = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", {day: "numeric", month: "short", timeZone: "UTC"});
  const weekday = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", {weekday: "short", timeZone: "UTC"});
  const isWorkday = d => { const w = new Date(d + "T12:00:00Z").getUTCDay(); return w > 0 && w < 6; };
  const pubDay = v => { const m = /^(\d{4})(\d{2})(\d{2})/.exec(v || ""); return m ? m[1] + "-" + m[2] + "-" + m[3] : null; };
  const fmtVersion = v => { const m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(v || ""); return m ? shortDay(m[1] + "-" + m[2] + "-" + m[3]) + ", " + m[4] + ":" + m[5] : (v || "?"); };
  const addDays = (d, n) => new Date(Date.parse(d + "T12:00:00Z") + n * 864e5).toISOString().slice(0, 10);
  const list = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  // "web-shop trial", "web-shop purchase" -> "web-shop trial and purchase"
  const listShared = a => { const p = a.length > 1 && a.every(x => x.split(" ")[0] === a[0].split(" ")[0]) ? a[0].split(" ")[0] + " " : "";
    return p ? p + list(a.map(x => x.slice(p.length))) : list(a); };
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
  const verb = (n, one, many) => n === 1 ? one : many;
  const baseId = id => id.split(":")[0];
  const keyOf = (m, c) => m + "|" + c.id + "|" + c.target;
  const pageChecked = m => R.markets[m].rating.coverage !== "tealium_only" && (R.markets[m].rating.pages_checked || 0) > 0;
  const evKey = c => c.id.split(":")[1];
  const evLabel = e => EVENTS[e] || e.replace(/_/g, " ");
  const convChecks = m => R.markets[m].checks.filter(c => baseId(c.id) === "CONV-01");
  // One check per event and market: when a market checks an event on two sites, the worst result counts.
  const RANK = {fail: 0, warn: 1, pass: 2, skip: 3};
  function convByEvent(m) {
    const out = new Map();
    for (const c of convChecks(m)) { const e = evKey(c), cur = out.get(e); if (!cur || (RANK[c.result] ?? 4) < (RANK[cur.result] ?? 4)) out.set(e, c); }
    return [...out.values()];
  }
  const convOffered = m => convByEvent(m).filter(c => c.result !== "skip");   // "skip" = the market does not offer this conversion
  const tagsOf = c => ((/tag\(s\)\s*([\d,\s]+)/.exec(c.detail || "") || [])[1] || "").trim().replace(/\s*,\s*/g, ", ");
  const sourceTag = c => ((/:\s*(.+?) would NOT fire/.exec(c.detail || "") || [])[1] || "");

  // --- acknowledgements --------------------------------------------------------------
  function allAcks() {
    return (P.acks_file || []).map(a => Object.assign({source: "file"}, a)).concat(liveAcks);
  }
  function ackFor(market, c) {
    const today = R.day;
    return allAcks().find(a =>
      (!a.expires || a.expires >= today) &&
      (a.market === market || a.market === "*") &&
      (a.check === c.id || a.check === baseId(c.id) || a.check === "*") &&
      (!a.target || a.target === "*" || a.target === c.target || a.target === c.target.split("#")[0]));
  }
  function activeIssues(market) {
    return R.markets[market].checks.filter(c => (c.result === "fail" || c.result === "warn") && !ackFor(market, c));
  }
  function rate(market) {
    const m = R.markets[market];
    const active = activeIssues(market);
    const red = active.filter(c => c.severity === "red" && c.result === "fail");
    const yellow = active.filter(c => c.severity === "yellow" || (c.severity === "red" && c.result === "warn"));
    const down = new Set(active.filter(c => c.severity === "site_down" && c.result === "fail").map(c => c.target));
    return {status: red.length ? "red" : yellow.length ? "yellow" : "green", red: red.length, yellow: yellow.length, yellowChecks: yellow,
            down: down.size, coverage: m.rating.coverage, blocked: m.rating.blocked_pages.length};
  }
  function globalStatus() {
    const failing = {};
    for (const code of MARKETS) for (const c of R.markets[code].checks) {
      if (c.result !== "fail" || !["red", "site_down"].includes(c.severity) || ackFor(code, c)) continue;
      const k = (c.id.startsWith("TAG:") || c.id.startsWith("CONV-")) ? c.id : baseId(c.id);
      (failing[k] = failing[k] || new Set()).add(code);
    }
    const incidents = Object.entries(failing).filter(([, s]) => s.size >= 3).map(([k, s]) => ({check: k, markets: [...s].sort()}));
    const worst = MARKETS.map(rate).reduce((w, r) => ORDER[r.status] > ORDER[w] ? r.status : w, "green");
    return {status: incidents.length ? "red" : worst, incidents};
  }

  // --- problems, owners and groups ---------------------------------------------------
  const lane = c => baseId(c.id).startsWith("CONS") ? "consent" : c.severity === "site_down" ? "site" : "conv";
  const actionable = code => activeIssues(code).filter(c => c.result === "fail" && (c.severity === "red" || c.severity === "site_down"));
  function problem(c) {
    const b = baseId(c.id);
    if (b === "CONV-01") { const t = tagsOf(c), s = sourceTag(c); return evLabel(evKey(c)) + ": " + (t ? "tag " + t : s || "conversion tag") + " doesn't fire"; }
    if (b === "GTM-07") { const m = /^([^:]+):/.exec(c.detail || ""); return (m ? m[1] : "GTM conversion") + " can't fire"; }
    if (b === "TAG" && / fires like on the market's other pages$/.test(c.title)) return c.title.replace(/ fires like on the market's other pages$/, " missing on some pages");
    return PROBLEMS[b] || c.title;
  }
  function diagEntry(code, c) {
    const f = ((D.markets || {})[code] || {}).findings || {};
    return f[c.id + "|" + c.target] || f[c.id] || null;
  }
  const diagText = (code, c) => { const d = diagEntry(code, c); return typeof d === "string" ? d : d && d.text || null; };
  // Who has to act: the diagnosis names an owner ("owner" field, or "Owner: ..." in the text).
  function team(s) {
    if (!s) return null;
    const t = s.toLowerCase();
    if (/martech|tealium/.test(t)) return "MarTech";
    if (/agency|paid media/.test(t)) return "Agency";
    if (/gtm/.test(t)) return "GTM owner";
    if (/web|marketing automation|site/.test(t)) return "Web team";
    if (/privacy|legal/.test(t)) return "Privacy";
    return s.length <= 24 ? s : null;
  }
  function ownerOf(code, c) {
    const d = diagEntry(code, c);
    if (d && typeof d === "object" && d.owner) return team(d.owner);
    const m = /Owners?:\s*([^.;]+)/i.exec(typeof d === "string" ? d : d && d.text || "");
    return m ? team(m[1]) : null;
  }
  function groupKey(c) {
    const b = baseId(c.id);
    if (b === "CONV-01") return c.id;
    if (b === "TAG") return "TAG|" + c.title;
    if (b === "GTM-07") return c.id + "|" + c.target;
    return b;
  }
  // One entry per market and problem; the same failure on several pages is one entry.
  function groupsOf(codes, pick) {
    const out = new Map();
    for (const code of codes) for (const c of pick(code)) {
      const k = code + "|" + groupKey(c);
      if (!out.has(k)) out.set(k, {code, checks: [], lane: lane(c)});
      out.get(k).checks.push(c);
    }
    return [...out.values()].map(g => {
      const pages = new Set(g.checks.map(c => c.target).filter(t => t && t !== "market" && !t.startsWith("conversion:")));
      const texts = g.checks.map(c => diagText(g.code, c)).filter(Boolean);
      return Object.assign(g, {title: problem(g.checks[0]), pages: pages.size,
        text: texts.find(t => !/^same (cause|as)\b/i.test(t)) || texts[0] || g.checks[0].detail,
        owner: g.checks.map(c => ownerOf(g.code, c)).find(Boolean) || null});
    }).map((g, i, all) => {
      if (!g.owner && /^same (cause|as)\b/i.test(g.text)) g.owner = (all.find(o => o.code === g.code && o.lane === g.lane && o.owner) || {}).owner || null;
      g.text = g.text.replace(/\s*Owners?:\s*.*?(\.(?=\s+[A-Z])|\.?$)/i, "").trim();   // the owner sentence ends at ". " + capital, not at "ciel.com"
      return g;
    });
  }
  const consentProblems = code => groupsOf([code], actionable).filter(g => g.lane === "consent").length;
  const lostEvents = code => convOffered(code).filter(c => c.result === "fail" && !ackFor(code, c)).map(c => evLabel(evKey(c)).toLowerCase());

  // --- time: freshness, next run, missing run ------------------------------------------
  const TZ = "Europe/Berlin";
  function zoned(t) {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23"})
      .formatToParts(new Date(t)).map(x => [x.type, x.value]));
    return {day: p.year + "-" + p.month + "-" + p.day, hour: +p.hour, minute: +p.minute};
  }
  function atLocal(day, hour) {   // timestamp of <day> <hour>:00 Berlin time
    const guess = Date.parse(day + "T" + String(hour).padStart(2, "0") + ":00:00Z");
    const z = zoned(guess), shown = Date.parse(z.day + "T" + String(z.hour).padStart(2, "0") + ":" + String(z.minute).padStart(2, "0") + ":00Z");
    return guess - (shown - guess);
  }
  function nextRun(now) {
    const today = zoned(now).day;
    for (let i = 0; i < 8; i++) { const d = addDays(today, i); if (isWorkday(d) && atLocal(d, 8) > now) return atLocal(d, 8); }
    return null;
  }
  function expectedRunDay(now) {   // the latest workday whose run should be in by 10:00 (routine publishes ~08:00)
    const today = zoned(now).day;
    for (let i = 0; i < 8; i++) { const d = addDays(today, -i); if (isWorkday(d) && atLocal(d, 10) <= now) return d; }
    return null;
  }
  function ago(t, now) {
    const m = Math.round((now - t) / 6e4);
    if (m < 60) return plural(Math.max(m, 1), "min", "min") + " ago";
    const h = Math.round(m / 60);
    return h < 48 ? plural(h, "hour", "hours") + " ago" : plural(Math.round(h / 24), "day", "days") + " ago";
  }

  // --- rendering -----------------------------------------------------------------------
  function pill(status, label) {
    const cls = {green: "s-green", yellow: "s-yellow", red: "s-red", down: "s-down", cfg: "s-cfg"}[status] || "s-sys";
    return el("span", {class: "chip " + cls}, label || status);
  }
  function dotFor(code) {
    const r = rate(code);
    return el("i", {class: "sd " + (r.down ? "down" : r.status) + (pageChecked(code) ? "" : " cfg"), "aria-hidden": "true"});
  }
  function statusText(code) {
    const r = rate(code);
    if (r.down) return "site down";
    return r.status + (pageChecked(code) ? "" : ", config only");
  }
  const smooth = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  function select(code) {
    if (!validScope(code)) return;
    const changed = code !== selected;
    selected = code; openAckFor = null; writeScope(code); history.replaceState(null, "", hashFor()); renderAll();
    if (changed) document.getElementById("sec-overview").scrollIntoView({block: "start", behavior: smooth()});
  }
  function openDay(day) {
    if (!RUNS[day] || day === R.day) return;
    loadRun(day); openAckFor = null; history.replaceState(null, "", hashFor()); renderAll();
    document.getElementById("sec-overview").scrollIntoView({block: "start", behavior: smooth()});
  }
  const isAll = () => selected === ALL;
  const scope = () => isAll() ? MARKETS : [selected];
  const name = code => R.markets[code].name;

  function renderNav() {
    const g = globalStatus();
    const all = el("button", {class: "mk", type: "button", "aria-pressed": String(isAll()), "aria-label": "All markets: overall " + g.status, onclick: () => select(ALL)},
      el("i", {class: "sd " + g.status, "aria-hidden": "true"}), el("span", {class: "nm"}, "All markets"));
    fill("marketnav", all, MARKETS.map(code => el("button", {class: "mk", type: "button", "aria-pressed": String(code === selected),
      "aria-label": name(code) + ": " + statusText(code), title: name(code) + ": " + statusText(code), onclick: () => select(code)},
      dotFor(code), el("span", {class: "nm"}, code))));
  }

  // One line per market, the same rules for every market, so no market stands out because it has more data.
  function marketLine(code) {
    const r = rate(code), lost = lostEvents(code), cons = consentProblems(code);
    if (r.down) return plural(r.down, "page did not load", "pages did not load");
    if (lost.length) return "Loses " + listShared(lost) + " conversions";
    if (cons) return plural(cons, "consent issue", "consent issues");
    if (r.red) return plural(r.red, "broken check", "broken checks");
    if (r.yellow) return plural(r.yellow, "item", "items") + " to review";
    return pageChecked(code) ? "Everything checked works" : "Clean in Tealium, no page opened";
  }

  function allVerdict() {
    const N = MARKETS.length;
    const losing = MARKETS.filter(c => lostEvents(c).length);
    const otherRed = MARKETS.filter(c => !losing.includes(c) && rate(c).status === "red");
    let lead;
    if (losing.length) lead = losing.length + " of " + N + " markets " + verb(losing.length, "loses", "lose") + " conversions" +
      (losing.length <= 2 ? ": " + list(losing.map(name)) : "") + ".";
    else lead = "No market loses conversions" + (otherRed.length ? ", but " + list(otherRed.map(name)) + " " + verb(otherRed.length, "has", "have") + " broken checks." : ".");
    const rest = [];
    const others = MARKETS.filter(c => !losing.includes(c) && !otherRed.includes(c));
    const down = others.filter(c => rate(c).down);
    const okVerified = others.filter(c => !rate(c).down && pageChecked(c));
    const okConfig = others.filter(c => !rate(c).down && !pageChecked(c));
    if (down.length) rest.push("Pages in " + list(down.map(name)) + " did not load.");
    if (okConfig.length && !okVerified.length && !down.length && losing.length + otherRed.length)
      rest.push("Only " + list(okConfig.map(name)) + " " + verb(okConfig.length, "looks", "look") + " clean, and only in Tealium.");
    else {
      if (okVerified.length) rest.push(list(okVerified.map(name)) + " " + verb(okVerified.length, "tracks", "track") + " on the page.");
      if (okConfig.length) rest.push(list(okConfig.map(name)) + " " + verb(okConfig.length, "looks", "look") + " clean, but only in Tealium.");
    }
    return [lead, rest.join(" ")];
  }

  function marketVerdict(code) {
    const r = rate(code), lost = lostEvents(code), m = R.markets[code], hasConv = convOffered(code).length > 0, cons = consentProblems(code);
    let lead;
    if (r.down) lead = name(code) + ": " + plural(r.down, "page did not load", "pages did not load") + ".";
    else if (lost.length) lead = name(code) + " loses its " + listShared(lost) + " conversions.";
    else if (cons) lead = name(code) + " has " + plural(cons, "consent issue", "consent issues") + ".";
    else if (r.red) lead = name(code) + " has " + plural(r.red, "broken check", "broken checks") + ".";
    else lead = (hasConv ? name(code) + " tracks every checked conversion." : name(code) + " has no conversion events set up yet.") +

        el("span", {class: "actions"}, pill(r.down ? "down" : r.status, r.down ? "Site down" : r.status[0].toUpperCase() + r.status.slice(1)),
          pageChecked(code) ? null : pill("cfg", "Tealium config only"))),
      el("p", {class: "muted"}, plural(issues.length, "finding", "findings") + " · " + passed + " checks passed · source: " + src +
        (m.red_since ? " · red since " + shortDay(m.red_since) + " (first seen by the monitor)" : "")),
      issues.length ? null : el("p", {}, pageChecked(code) ? "No findings. Everything checked is working." : "No findings in the Tealium configuration. No page was opened in this run."),
      LANES.map(([k, label]) => block(label, issues.filter(c => isAct(c) && lane(c) === k))),
      block("To review", issues.filter(c => !isAct(c))),
      infos.length ? el("details", {}, el("summary", {}, plural(infos.length, "informational note", "informational notes")), el("div", {class: "findings", style: "margin-top:10px"}, infos.map(c => findingNode(code, c)))) : null,
      pagesMatrix(code));
  }

  function pagesMatrix(code) {
    const m = R.markets[code];
    const groups = [["PAGE", "Page"], ["TEAL", "Tealium"], ["CONS", "Consent"], ["TAG", "Tags"], ["CLID", "Click IDs"]];
    const byTarget = {};
    for (const c of m.checks) (byTarget[c.target] = byTarget[c.target] || []).push(c);
    const rows = m.pages.filter(p => byTarget[p.id]).map(p => {
      const cs = byTarget[p.id];
      const blocked = cs.some(c => c.id === "BOT-01");
      return el("tr", {}, el("td", {}, el("div", {class: "mono"}, p.id), el("a", {href: p.url, target: "_blank", rel: "noopener", class: "muted"}, p.url.replace(/^https:\/\/www\.[^/]+/, ""))),
        groups.map(([g, label]) => {
          const mine = cs.filter(c => baseId(c.id) === g || baseId(c.id).startsWith(g + "-") || (g === "TAG" && c.id.startsWith("TAG")));
          let cls = "", tip = label + ": not run";
          if (blocked) { cls = "blocked"; tip = "Blocked by bot protection"; }
          else if (mine.length) {
            const bad = mine.filter(c => c.result === "fail" || (c.result === "warn" && c.severity !== "info"));
            const open = bad.filter(c => !ackFor(code, c));
            if (!bad.length) { cls = "pass"; tip = label + ": all passed"; }
            else if (!open.length) { cls = "acked"; tip = label + ": acknowledged"; }
            else { const w = open.find(c => c.severity === "red") || open.find(c => c.severity === "site_down") || open[0];
                   cls = w.result === "warn" ? "warn" : "fail-" + w.severity; tip = label + ": " + w.detail; }
          }
          return el("td", {class: "cell"}, el("span", {class: "dot " + cls, title: tip, role: "img", "aria-label": tip}));
        }));
    });
    if (!rows.length) return null;
    return el("div", {style: "display:grid;gap:10px;margin-top:6px"}, el("h3", {}, "Pages opened"),
      el("div", {class: "scroll"}, el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Page"), groups.map(([, l]) => el("th", {style: "text-align:center"}, l)))), el("tbody", {}, rows))),
      el("div", {class: "legend"}, ...[["pass", "passed"], ["fail-red", "red"], ["warn", "yellow"], ["fail-site_down", "site down"], ["blocked", "blocked"], ["acked", "acknowledged"]]
        .map(([c, l]) => el("span", {}, el("i", {class: "dot " + c}), l))));
  }

  // Shown only when a publish in scope changed something; "Last publish" in the matrix covers the rest.
  function renderPublish() {
    const box = document.getElementById("publish");
    const changed = scope().filter(c => { const u = R.markets[c].utag; return u.changed && ((u.diff || {}).items || []).length; });
    box.hidden = !changed.length;
    document.querySelector('[data-go="publish"]').hidden = !changed.length;
    if (!changed.length) { box.replaceChildren(); return; }
    fill("publish",
      el("div", {class: "head"}, el("h2", {}, "Tealium publishes"), el("span", {class: "muted"}, plural(changed.length, "profile", "profiles") + " changed since the last run")),
      changed.map(code => {
        const d = R.markets[code].utag.diff || {};
        const ai = ((D.publish || {})[code]) || null;
        const items = d.items || [];
        return el("div", {style: "display:grid;gap:8px"}, el("h3", {}, code + " · " + R.markets[code].tealium_profile + " · " + fmtVersion(d.from_version) + " → " + fmtVersion(d.to_version)),
          ai ? el("p", {class: "diag"}, (ai.risk ? "Risk " + ai.risk + ". " : "") + ai.summary) : null,
          el("details", {}, el("summary", {}, plural(items.length, "change", "changes") + ", " + items.filter(i => i.conversion_relevant).length + " conversion-relevant"),
            items.map(i => el("div", {class: "diffitem"},
              el("div", {}, el("b", {}, i.kind.replace(/_/g, " ")), " ", el("span", {class: "mono"}, i.tag ? "tag " + i.tag + (i.template ? " (template " + i.template + ")" : "") : "rule " + i.rule),
                i.conversion_relevant ? el("span", {class: "chip s-yellow", style: "margin-left:8px"}, "conversion") : null),
              i.before ? el("code", {}, "before: " + (typeof i.before === "string" ? i.before : JSON.stringify(i.before))) : null,
              i.after ? el("code", {}, "after: " + (typeof i.after === "string" ? i.after : JSON.stringify(i.after))) : null))));
      }));
  }

  // Sidebar: scroll to a section, and mark the section in view.
  const navs = [...document.querySelectorAll("[data-go]")];
  for (const b of navs) b.addEventListener("click", () => {
    const t = document.getElementById(b.dataset.go);
    if (t) t.scrollIntoView({behavior: smooth(), block: "start"});
  });
  let spyQueued = false;
  function spy() {
    spyQueued = false;
    let cur = navs[0];
    for (const b of navs) { const t = document.getElementById(b.dataset.go); if (t && !t.hidden && t.getBoundingClientRect().top <= 140) cur = b; }
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = navs.filter(b => !b.hidden && !document.getElementById(b.dataset.go).hidden).pop() || cur;
    for (const b of navs) b.setAttribute("aria-current", String(b === cur));
  }
  addEventListener("scroll", () => { if (!spyQueued) { spyQueued = true; requestAnimationFrame(spy); } }, {passive: true});

  function renderAll() {
    renderNav(); renderHeader(); renderMatrix(); renderHistory();
    if (isAll()) renderNeeds(); else renderMarket();
    renderPublish(); spy();
  }
  window.addEventListener("hashchange", () => {
    const h = parseHash(), day = h.day && RUNS[h.day] ? h.day : LATEST;
    if (day !== R.day) loadRun(day);
    if (validScope(h.scope)) selected = h.scope;
    renderAll();
  });
  renderAll();

  // --- live acknowledgements (artifact only) ------------------------------------------
  if (MODE === "artifact" && window.claude && claude.use) {
    (async () => {
      try {
        user = await claude.use("user");
        if (user) { try { myId = await user.id(); } catch (e) { myId = null; } }
        db = await claude.use("db");
        window.__dbTried = true;
        if (!db) { renderHeader(); return; }
        canWrite = true;
        if (user && user.can) { try { const w = await user.can("data.write"); if (w === false) canWrite = false; } catch (e) {} }
        db.collection("acks").onSnapshot(async snap => {
          liveAcks = snap.docs.map(d => Object.assign({_id: d.id, source: "live"}, d.data()));
          const ids = [...new Set(liveAcks.map(a => a.by).filter(Boolean))];
          if (user && ids.length) { try { const ps = await user.profiles(ids); for (const id of ids) names[id] = (ps[id] && ps[id].name) || "Someone"; } catch (e) {} }
          renderAll();
        }, () => { renderAll(); });
      } catch (e) { window.__dbTried = true; renderHeader(); }
    })();
  }
})();
</script>
